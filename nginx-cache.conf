# nginx-cache.conf — Reference Nginx configuration for cache headers
# Copy relevant blocks to /etc/nginx/sites-enabled/kidversa.conf on production VPS
#
# IMPORTANT: This file is for documentation only.
# Do NOT include this file directly — copy the relevant blocks.

# Static files: CSS/JS — aggressive cache (invalidated via query string ?v=X.Y.Z)
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# Static files: Images — moderate cache (1 day)
location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
}

# Static files: Fonts — long cache (1 year)
location ~* \.(woff|woff2|ttf|eot|otf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}
