name: CI

on:
  push:
    branches: [ main, v4.1 ]
  pull_request:
    branches: [ main, v4.1 ]

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      
      - name: Check PHP syntax
        run: find src/ public/ -name "*.php" -exec php -l {} \; 2>&1 | (! grep -v "No syntax errors")
      
      - name: Validate composer.json
        run: composer validate --strict

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t kidversa-studio:test .
      
      - name: Verify container starts
        run: |
          docker run -d --name test -p 8080:80 kidversa-studio:test
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          docker stop test
